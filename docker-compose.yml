services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two PLAINTEXT listeners: HOST is what the FastAPI app / host-run
      # scripts connect to (localhost:9092); DOCKER is what other
      # docker-compose services (the poller) connect to, since "localhost"
      # inside the poller's own container would mean the poller itself, not
      # this kafka container.
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  poller:
    build:
      context: ./backend
    command: ["python", "-m", "streaming.now_playing_producer"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  # Single spark-submit container - no separate master/worker needed for a
  # single-node personal-project deployment. Requires GOOGLE_APPLICATION_CREDENTIALS_HOST
  # set in a root .env (see .env.example) pointing at the same GCP service-account
  # key file the ingestion scripts already use.
  spark:
    image: bitnami/spark:3.5
    command:
      - spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,com.google.cloud.spark:spark-bigquery-with-dependencies_2.12:0.36.1
      - /opt/spark-app/streaming_job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BQ_PROJECT_ID: ${BQ_PROJECT_ID:-spotify-trend-dashboard}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/key.json
      CHECKPOINT_LOCATION: /opt/spark-checkpoints/now_playing
    volumes:
      - ./spark:/opt/spark-app
      - spark_checkpoints:/opt/spark-checkpoints
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST}:/opt/gcp/key.json:ro
    depends_on:
      - kafka
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  # First run only: `docker compose run --rm airflow-webserver airflow db init`
  # then create an admin user (`airflow users create ...`) before `up -d`.
  airflow-webserver:
    build:
      context: ./airflow
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/key.json
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/airflow/project/backend
      - ./dbt:/opt/airflow/project/dbt
      - ./dbt/profiles.yml:/opt/airflow/dbt_profiles/profiles.yml:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST}:/opt/gcp/key.json:ro
    depends_on:
      - airflow-postgres

  airflow-scheduler:
    build:
      context: ./airflow
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp/key.json
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/airflow/project/backend
      - ./dbt:/opt/airflow/project/dbt
      - ./dbt/profiles.yml:/opt/airflow/dbt_profiles/profiles.yml:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST}:/opt/gcp/key.json:ro
    depends_on:
      - airflow-postgres

volumes:
  redis_data:
  kafka_data:
  spark_checkpoints:
  airflow_postgres_data:
